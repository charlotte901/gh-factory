name: ghreg-register

on:
  workflow_dispatch:
    inputs:
      email:
        required: false
        type: string
        default: ""
      username:
        required: false
        type: string
        default: ""
      password:
        required: false
        type: string
        default: ""
      wb_link:
        required: false
        type: string
        default: ""
      round_id:
        required: true
        type: string

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd worker && npm install 2>&1 | tee ../npm.log

      - name: Pre-download browser
        run: |
          cd worker && npx cloakbrowser install 2>&1 | tee ../browser.log

      - name: Setup headful environment
        run: |
          sudo apt-get install -y -qq xvfb fonts-liberation >/dev/null 2>&1 || true

      - name: Run worker
        env:
          EMAIL: ${{ inputs.email }}
          USERNAME: ${{ inputs.username }}
          PASSWORD: ${{ inputs.password }}
          WB_LINK: ${{ inputs.wb_link }}
          ROUND_ID: ${{ inputs.round_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd worker && xvfb-run -a --server-args="-screen 0 1920x1080x24" node register.js 2>&1 | tee ../worker-output.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-diag
          path: |
            npm.log
            browser.log
            worker-output.log
          if-no-files-found: ignore
          retention-days: 1
